name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qissa
          POSTGRES_PASSWORD: qissa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qissa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The tests create and migrate this database themselves.
      TEST_DATABASE_URL: postgresql+psycopg://qissa:qissa@localhost:5432/qissa_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
